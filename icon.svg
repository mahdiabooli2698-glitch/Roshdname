<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="55%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="page" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- rounded square background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  <!-- subtle inner highlight -->
  <rect x="24" y="24" width="464" height="464" rx="92" ry="92" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>
  
  <!-- open book -->
  <g filter="url(#soft)">
    <!-- left page -->
    <path d="M118 152 C118 140 128 132 142 132 L248 132 C256 132 262 136 256 148 L256 360 C256 372 248 380 236 380 L142 380 C128 380 118 372 118 360 Z" fill="url(#page)"/>
    <!-- right page -->
    <path d="M394 152 C394 140 384 132 370 132 L264 132 C256 132 250 136 256 148 L256 360 C256 372 264 380 276 380 L370 380 C384 380 394 372 394 360 Z" fill="url(#page)"/>
    <!-- spine shadow -->
    <rect x="248" y="140" width="16" height="232" rx="2" fill="#0f766e" opacity="0.25"/>
    <!-- page lines left -->
    <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" opacity="0.45">
      <line x1="148" y1="190" x2="230" y2="190"/>
      <line x1="148" y1="220" x2="220" y2="220"/>
      <line x1="148" y1="250" x2="230" y2="250"/>
      <line x1="148" y1="280" x2="210" y2="280"/>
    </g>
    <!-- page lines right -->
    <g stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round" opacity="0.45">
      <line x1="282" y1="190" x2="364" y2="190"/>
      <line x1="292" y1="220" x2="364" y2="220"/>
      <line x1="282" y1="250" x2="364" y2="250"/>
      <line x1="302" y1="280" x2="364" y2="280"/>
    </g>
  </g>
  
  <!-- growth sprout / plant over the book -->
  <g transform="translate(256, 268)">
    <!-- stem -->
    <path d="M0 42 C0 20 -2 8 -4 -4" fill="none" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
    <!-- left leaf -->
    <path d="M-4 -2 C-28 -18 -42 -8 -36 12 C-22 8 -10 6 -4 -2Z" fill="url(#leaf)" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- right leaf -->
    <path d="M-2 0 C22 -16 40 -4 34 16 C18 10 6 6 -2 0Z" fill="url(#leaf)" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- center bud -->
    <circle cx="0" cy="-8" r="9" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.5"/>
    <circle cx="0" cy="-8" r="4" fill="#5eead4"/>
  </g>
  
  <!-- subtle bottom accent bar -->
  <rect x="118" y="392" width="276" height="10" rx="5" fill="rgba(255,255,255,0.2)"/>
</svg>
